<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okoskodó – Nyomtatható értékelőlapok (A4 PDF)</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preload" href="/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/nunito-sans-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/print.css">
</head>
<body class="print-report-body">

  <!-- Képernyős vezérlősáv (Nyomtatáskor és PDF mentéskor szigorúan rejtve) -->
  <div class="print-toolbar no-print">
    <button type="button" onclick="window.print()" class="btn btn-primary btn-lg">
      🖨️ Nyomtatás / Mentés PDF-be
    </button>
    <button type="button" onclick="window.close()" class="btn btn-secondary btn-lg">
      ✕ Bezárás
    </button>
  </div>

  <!-- Dinamikus diák-oldalak konténere -->
  <div id="print-pages-container">
    <div style="text-align: center; color: #64748b; padding: 40px;">Értékelőlapok betöltése...</div>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    function formatPrintAnswer(raw) {
      if (!raw) return '';
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed.map(formatCode).join(' vagy ');
      } catch {}
      return formatCode(raw);
    }

    function renderPrintCorrectAnswer(q) {
      if (!q || !q.correct_answer) return '–';
      if (q.question_type === 'ABCD') {
        return renderAnswerDisplayHtml(q.correct_answer, q.options || []);
      }
      return formatPrintAnswer(q.correct_answer);
    }

    (async function() {
      const container = document.getElementById('print-pages-container');
      const urlParams = new URLSearchParams(window.location.search);
      let sessionId = urlParams.get('sessionId');

      try {
        if (!sessionId) {
          // 1. Megpróbáljuk megkeresni az aktív dolgozatot, amelyben vannak diákok
          const sRes = await fetch('/api/sessions/active');
          const active = await sRes.json();
          const activeWithStudents = Array.isArray(active) ? active.find(s => s.participant_count > 0) : null;
          if (activeWithStudents) {
            sessionId = activeWithStudents.id;
          } else if (Array.isArray(active) && active.length > 0) {
            sessionId = active[0].id;
          } else {
            // 2. Ha nincs aktív dolgozat, az archívumból választjuk a legutóbbi kitöltött dolgozatot
            const allRes = await fetch('/api/admin/sessions');
            if (allRes.ok) {
              const all = await allRes.json();
              const withStudents = Array.isArray(all) ? (all.find(s => s.participant_count > 0) || all[0]) : null;
              if (withStudents) sessionId = withStudents.id;
            }
          }
        }

        if (!sessionId) {
          container.innerHTML = '<div style="text-align: center; color: #b91c1c; padding: 40px;">Nem található aktív vagy megadott dolgozat!</div>';
          return;
        }

        const res = await fetch('/api/admin/sessions/' + sessionId + '/matrix');
        const data = await res.json();
        if (!res.ok) {
          container.innerHTML = '<div style="text-align: center; color: #b91c1c; padding: 40px;">Hiba a dolgozat adatainak betöltésekor!</div>';
          return;
        }

        const { session, questions, participants, answers, totalMaxPoints } = data;
        const answerMap = new Map();
        answers.forEach(a => answerMap.set(a.participant_id + ':' + a.question_id, a));

        if (participants.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 40px;">Nincs diák ebben a dolgozatban.</div>';
          return;
        }

        container.innerHTML = '';
        participants.forEach(p => {
          const page = document.createElement('div');
          page.className = 'print-page';

          page.innerHTML = `
            <div class="print-header">
              <div class="print-header-left">
                <img src="/img/logo.png" alt="Okoskodó" class="print-header-logo">
                <div>
                  <h2 class="print-title">${escapeHtml(session.quiz_title)}</h2>
                  <div class="print-meta">Tantárgy: <strong>${escapeHtml(session.subject_name)}</strong> | Évfolyam: <strong>${escapeHtml(session.grade_level)}. évfolyam</strong></div>
                </div>
              </div>
              <div class="print-header-right">
                <div class="print-student-name">${escapeHtml(p.student_name)}</div>
                <div class="print-meta">${p.pc_number ? escapeHtml(p.pc_number) + '. gép' : 'Diák'} | Dátum: <strong>${new Date().toLocaleDateString('hu-HU')}</strong></div>
              </div>
            </div>

            <div class="print-score-box">
              <div class="print-score-main">${escapeHtml(p.total_points)} / ${escapeHtml(totalMaxPoints)} pont (${escapeHtml(p.percentage)}%)</div>
              <div class="print-score-grade">Érdemjegy: ${escapeHtml(p.gradeText)}</div>
            </div>

            <div class="print-questions-section">
              <h3 class="print-section-title">Kérdések és válaszok:</h3>
              ${questions.map((q, idx) => {
                const a = answerMap.get(p.id + ':' + q.id);
                const isCor = a && a.eval_status === 'CORRECT';
                const isPartial = a && a.eval_status === 'PARTIAL';
                const statusCls = isCor ? 'print-correct' : (isPartial ? 'print-partial' : 'print-wrong');
                const statusText = isCor ? '✓ Helyes' : (isPartial ? '◐ Részpontszám' : '✗ Hibás');
                const submittedHtml = a ? renderAnswerDisplayHtml(a.submitted_answer, q.options || []) : '–';
                const correctHtml = renderPrintCorrectAnswer(q);
                return `
                  <div class="print-question-item">
                    <div class="print-q-title">${idx + 1}. ${formatCode(q.question_text)} (${q.points}p)</div>
                    ${q.image_path ? `<div class="print-q-image"><img src="${escapeHtml(q.image_path)}" alt="Kérdés képe"></div>` : ''}
                    <div class="print-answer-row">
                      <span>Adott válasz:</span>
                      <strong>${submittedHtml}</strong>
                    </div>
                    <div class="print-status-row ${statusCls}">${statusText} (${a ? a.points_earned : 0}p)</div>
                    ${!isCor ? `<div class="print-answer-row print-correct-row"><span>Helyes válasz:</span> <strong>${correctHtml}</strong></div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `;

          container.appendChild(page);
        });

      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #b91c1c; padding: 40px;">Hiba történt az értékelőlapok betöltésekor: ' + escapeHtml(err.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
