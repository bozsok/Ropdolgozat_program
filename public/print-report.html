<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyomtatható Értékelőlapok (A4 PDF)</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/print.css">
</head>
<body style="background: #ffffff; padding: 20px;">

  <!-- Képernyős vezérlősáv (Nyomtatáskor rejtve) -->
  <div class="no-print" style="max-width: 800px; margin: 0 auto 24px auto; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 14px 20px; border-radius: 8px; border: 1px solid #cbd5e1;">
    <div>
      <h3 style="margin: 0; font-size: 1.1rem;">🖨️ Nyomtatásra és PDF mentésre kész</h3>
      <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.9rem;">Minden diák értékelőlapja automatikusan új A4-es oldalra kerül.</p>
    </div>
    <button onclick="window.print()" class="btn btn-primary btn-lg">
      🖨️ Nyomtatás / Mentés PDF-be
    </button>
  </div>

  <!-- Dinamikus diák-oldalak konténere -->
  <div id="print-pages-container">
    <div style="text-align: center; color: #64748b; padding: 40px;">Értékelőlapok betöltése...</div>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    (async function() {
      const container = document.getElementById('print-pages-container');
      const urlParams = new URLSearchParams(window.location.search);
      let sessionId = urlParams.get('sessionId');

      try {
        if (!sessionId) {
          // 1. Megpróbáljuk megkeresni az aktív dolgozatot, amelyben vannak diákok
          const sRes = await fetch('/api/sessions/active');
          const active = await sRes.json();
          const activeWithStudents = Array.isArray(active) ? active.find(s => s.participant_count > 0) : null;
          if (activeWithStudents) {
            sessionId = activeWithStudents.id;
          } else if (Array.isArray(active) && active.length > 0) {
            sessionId = active[0].id;
          } else {
            // 2. Ha nincs aktív dolgozat, az archívumból választjuk a legutóbbi kitöltött dolgozatot
            const allRes = await fetch('/api/admin/sessions');
            if (allRes.ok) {
              const all = await allRes.json();
              const withStudents = Array.isArray(all) ? (all.find(s => s.participant_count > 0) || all[0]) : null;
              if (withStudents) sessionId = withStudents.id;
            }
          }
        }

        if (!sessionId) {
          container.innerHTML = '<div style="text-align: center; color: #b91c1c; padding: 40px;">Nem található aktív vagy megadott dolgozat!</div>';
          return;
        }

        const res = await fetch('/api/admin/sessions/' + sessionId + '/matrix');
        const data = await res.json();
        if (!res.ok) {
          container.innerHTML = '<div style="text-align: center; color: #b91c1c; padding: 40px;">Hiba a dolgozat adatainak betöltésekor!</div>';
          return;
        }

        const { session, questions, participants, answers, totalMaxPoints } = data;
        const answerMap = new Map();
        answers.forEach(a => answerMap.set(a.participant_id + ':' + a.question_id, a));

        if (participants.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 40px;">Nincs diák ebben a dolgozatban.</div>';
          return;
        }

        container.innerHTML = '';
        participants.forEach(p => {
          const page = document.createElement('div');
          page.className = 'print-page';

          page.innerHTML = `
            <div class="print-header">
              <div>
                <div class="print-title">${escapeHtml(session.quiz_title)}</div>
                <div class="print-meta">Tantárgy: ${escapeHtml(session.subject_name)} | Évfolyam: ${escapeHtml(session.grade_level)}. évfolyam</div>
              </div>
              <div style="text-align: right;">
                <div style="font-size: 14pt; font-weight: bold;">${escapeHtml(p.student_name)}</div>
                <div class="print-meta">${p.pc_number ? p.pc_number + '. gép' : 'Diák'} | Dátum: ${new Date().toLocaleDateString('hu-HU')}</div>
              </div>
            </div>

            <div class="print-score-box">
              <div>
                <span style="font-size: 12pt; font-weight: bold;">Elért összpontszám:</span>
                <span style="font-size: 14pt; font-weight: bold; color: #1e40af; margin-left: 8px;">${p.total_points} / ${totalMaxPoints} pont (${p.percentage}%)</span>
              </div>
              <div>
                <span style="font-size: 12pt; font-weight: bold;">KRÉTA érdemjegy:</span>
                <span style="font-size: 14pt; font-weight: bold; margin-left: 8px;">${p.gradeText}</span>
              </div>
            </div>

            <div style="margin-top: 15px;">
              <div style="font-size: 11pt; font-weight: bold; margin-bottom: 8px;">Részletes válaszok és értékelés:</div>
              ${questions.map((q, idx) => {
                const a = answerMap.get(p.id + ':' + q.id);
                const isCor = a && a.is_correct === 1;
                return `
                  <div class="print-question-item">
                    <div class="print-q-title">${idx + 1}. ${formatCode(q.question_text)} (${q.points} pont)</div>
                    <div class="print-answer-row">
                      Adott válasz: <strong>${a ? formatCode(a.submitted_answer) : '–'}</strong>
                      <span class="${isCor ? 'print-correct' : 'print-wrong'}" style="margin-left: 12px;">
                        ${isCor ? '✓ Helyes' : '✗ Hibás'} (${a ? a.points_earned : 0} pont)
                      </span>
                    </div>
                    ${!isCor ? `<div class="print-answer-row" style="color: #4b5563;">Helyes megoldás: <strong>${formatCode(q.correct_answer)}</strong></div>` : ''}
                    ${q.explanation ? `<div class="print-answer-row" style="color: #6b7280; font-style: italic;">Magyarázat: ${formatCode(q.explanation)}</div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `;

          container.appendChild(page);
        });

      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #b91c1c; padding: 40px;">Hiba történt az értékelőlapok betöltésekor: ' + escapeHtml(err.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
